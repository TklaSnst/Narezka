[package]
name = "shortscutter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sc-core.workspace = true
sc-media.workspace = true
sc-analysis.workspace = true
sc-raster.workspace = true
sc-compositor.workspace = true
sc-render.workspace = true
sc-library.workspace = true
sc-i18n.workspace = true
sc-mpv.workspace = true
eframe.workspace = true
log.workspace = true
env_logger.workspace = true
rfd = "0.17"
# Уведомление по окончании рендера (D-Bus через zbus, без libdbus).
notify-rust = "4.19"
# Миниатюры библиотеки (PNG от ffmpeg); версия — как у sc-raster.
image = { version = "0.25", default-features = false, features = ["png"] }
# Локальное время для дат в библиотеке.
libc = "0.2"
# wl_display окна для mpv (VAAPI на Wayland); версия — как у eframe.
raw-window-handle = "0.6"
