# Чистый фон + заголовок — по devops-short-alert.jpg и devops-short-bash.jpg: тёмный градиент,
# капсула «Часть N», крупный заголовок слева с акцентом-плашкой, видео ниже со скруглением.
name = "clean-title"
background = { type = "gradient", from = "#211c4a", to = "#0c0a1e", angle = 0 }

[[layers]]
type = "capsule"
rect = { x = 0.1, y = 0.15, w = 0.36, h = 0.042 }
text = "Часть {part}"
font = "Montserrat Bold"
text_color = "#ffffff"
fill = "#3a3478"

[[layers]]
type = "text"
rect = { x = 0.1, y = 0.21, w = 0.8, h = 0.17 }
content = "{title}"
font = "Montserrat Black"
size = 0.075
color = "#ffffff"
accent_color = "#e5483f"
accent_mode = "plate"
align = "left"
valign = "top"

[[layers]]
type = "main_video"
crop = { x = 0.0, y = 0.0, w = 1.0, h = 1.0 }
dest = { x = 0.06, y = 0.41, w = 0.88, h = 0.2784 }
corner_radius = 0.025
border = { width = 0.003, color = "#6c63c9" }
shadow = { color = "#000000a0", blur = 0.025, dy = 0.01 }

# Субтитры «проявлением»: сказанные — белым, текущее — цветом акцента, несказанные — серым.
[[layers]]
type = "subtitles"
rect = { x = 0.08, y = 0.70, w = 0.76, h = 0.065 }
font = "Montserrat ExtraBold"
size = 0.055
color = "#ffffff"
active_color = "#e5483f"
keyword_color = "#ffd60a"
dim_color = "#ffffff50"
mode = "reveal"
words_per_line = 3
lines = 1
