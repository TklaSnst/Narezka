name = "text-test"
background = { type = "blur", darken = 0.45, scale = 1.3 }

[[layers]]
type = "main_video"
crop = { x = 0.0, y = 0.0, w = 1.0, h = 1.0 }
dest = { x = 0.0, y = 0.33, w = 1.0, h = 0.3164 }

[[layers]]
type = "capsule"
rect = { x = 0.25, y = 0.05, w = 0.5, h = 0.045 }
text = "DevOps · Часть {part}"
font = "DejaVu Sans Bold"
text_color = "#ffffff"
fill = "#1d1d1fcc"

[[layers]]
type = "text"
rect = { x = 0.06, y = 0.12, w = 0.88, h = 0.18 }
content = "{title}"
font = "DejaVu Sans Bold"
size = 0.075
color = "#ffffff"
accent_color = "#ff3b30"

[[layers]]
type = "text"
rect = { x = 0.06, y = 0.68, w = 0.88, h = 0.1 }
content = "ТОП *ЯЗЫКОВ*\nПРОГРАММИРОВАНИЯ"
font = "JetBrains Mono ExtraBold"
size = 0.065
color = "#ffffff"
accent_color = "#ff3030"
shadow = { color = "#000000", dx = 0.006, dy = 0.006 }

[[layers]]
type = "text"
rect = { x = 0.06, y = 0.8, w = 0.88, h = 0.08 }
content = "это *алерт*, а не шум"
font = "DejaVu Sans Bold"
size = 0.06
color = "#ffffff"
accent_color = "#e0302a"
accent_mode = "plate"

[[layers]]
type = "text"
rect = { x = 0.04, y = 0.89, w = 0.92, h = 0.08 }
content = "Подпись с обводкой и мягкой тенью — довольно длинная, чтобы перенестись"
font = "DejaVu Sans Bold"
size = 0.05
color = "#ffffff"
outline = { width = 0.005, color = "#000000" }
shadow = { color = "#000000b0", blur = 0.01, dy = 0.004 }
